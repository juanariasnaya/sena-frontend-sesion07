<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Producto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="spinner-container" class="spinner-container">
        <div class="spinner"></div>
    </div>

    <main id="main-content" class="container hidden-content">
        <div class="product-card">
            <span class="badge">NUEVO</span>
            <div class="product-image">
                <img src="img/audifonos.jpg" alt="Auriculares Inalámbricos">
            </div>
            <h2 class="product-name">Auriculares Inalámbricos</h2>
            <p class="product-price">$59.000</p>
            <div class="button-wrapper">
                <button class="add-to-cart-btn">Agregar al carrito</button>
                <div class="tooltip">¡Añadir este producto a la bolsa!</div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
